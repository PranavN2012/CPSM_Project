name: CSPM Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-security-scan:
    name: 🛡️ Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run CSPM Terraform Scanner
        id: scan
        run: |
          echo "## 🛡️ CSPM Terraform Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python scripts/terraform-scanner.py terraform/ || true
          
          if [ -f terraform/security-scan-results.md ]; then
            cat terraform/security-scan-results.md >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No security issues found!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request' && hashFiles('terraform/security-scan-results.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'terraform/security-scan-results.md';
            
            if (fs.existsSync(reportPath)) {
              const body = fs.readFileSync(reportPath, 'utf8');
              
              // Find existing comment
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              
              const existing = comments.data.find(c => 
                c.user.login === 'github-actions[bot]' && 
                c.body.includes('CSPM Security Scan')
              );
              
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body,
                });
              }
            }

  python-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # GROWTH_PLAN.md Phase 7: previously only installed enough to run
        # test_compliance.py. The full suite (tests/) also needs PyYAML
        # (policy_engine.py) and the AI/ML stack (requirements-ai.txt) for
        # the Layer 1-5 + orchestrator tests. No LLM API key is configured
        # here — those tests exercise the RuleBasedPolicyDrafter/Reasoner
        # fallback path and mocked LLM clients, not real Groq/Gemini calls,
        # by design (see lambda/shared/ml/orchestrator.py's docstring).
        run: |
          pip install pytest boto3 botocore fpdf2 pyyaml
          pip install -r requirements-ai.txt

      - name: Run full test suite
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: |
          pytest tests/ -v --tb=short
